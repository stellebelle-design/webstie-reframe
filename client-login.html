<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client login — Reframe Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="client-hub.css">
<style>
.login-wrap{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:48px 22px}.login-card{width:min(460px,100%);background:var(--white);border:1px solid var(--line);padding:clamp(28px,6vw,52px)}.login-card h1{font:500 clamp(2.7rem,7vw,4rem)/1 var(--serif);margin:0}.login-card h1 em{font-family:var(--script);font-style:normal;color:var(--stone)}.login-card>p:not(.eyebrow){color:var(--ink-soft);font-size:.9rem}.login-card label{display:block;margin:20px 0 7px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}.login-card input{width:100%;padding:13px;border:1px solid var(--line);background:var(--cream);color:var(--ink)}.login-submit{width:100%;margin-top:25px;padding:14px;background:var(--ink);color:var(--cream);border:0;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem}.login-message{min-height:24px;font-size:.8rem;color:var(--ink-soft);margin-top:14px}.login-note{font-size:.72rem!important;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}
</style>
</head>
<body><div class="hub-shell"><header class="hub-header"><a class="brand" href="index.html">reframe <em>life</em></a><a class="back-link" href="index.html">Back to website ↗</a></header>
<main class="login-wrap"><section class="login-card"><p class="eyebrow">THE REFRAME LIFE CLIENT SPACE</p><h1>Welcome <em>back.</em></h1><p>Sign in with the email address linked to your client account.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="login-submit" type="submit">Sign in</button><p class="login-message" id="loginMessage" role="status"></p></form>
<p class="login-note">Client access is by invitation only. If you need help accessing your account, please contact Estelle.</p></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="client-login.js"></script>
</body></html>
